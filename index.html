<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Mangrove Monitoring - Egypt's Red Sea Coast
    </title>


    <!-- ================================================= -->
    <!-- LEAFLET CSS -->
    <!-- ================================================= -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >


    <!-- ================================================= -->
    <!-- GROUPED LAYER CONTROL CSS -->
    <!-- ================================================= -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet-groupedlayercontrol@0.6.1/dist/leaflet.groupedlayercontrol.min.css"
    >


    <!-- ================================================= -->
    <!-- PROJECT CSS -->
    <!-- ================================================= -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <div id="map"></div>


    <!-- ================================================= -->
    <!-- NDVI LEGEND -->
    <!-- ================================================= -->

    <div id="legend">

        <h4>
            🌿 Mangrove Health (NDVI)
        </h4>


        <div>
            <span
                style="background:#67001f;">
            </span>

            -0.5 – -0.4
        </div>


        <div>
            <span
                style="background:#b2182b;">
            </span>

            -0.4 – -0.3
        </div>


        <div>
            <span
                style="background:#d6604d;">
            </span>

            -0.3 – -0.2
        </div>


        <div>
            <span
                style="background:#f4a582;">
            </span>

            -0.2 – -0.1
        </div>


        <div>
            <span
                style="background:#fddbc7;">
            </span>

            -0.1 – 0.0
        </div>


        <div>
            <span
                style="
                    background:#ffffff;
                    border:1px solid #999;
                "
            ></span>

            0.0
        </div>


        <div>
            <span
                style="background:#d9f0d3;">
            </span>

            0.0 – 0.1
        </div>


        <div>
            <span
                style="background:#a6dba0;">
            </span>

            0.1 – 0.2
        </div>


        <div>
            <span
                style="background:#5aae61;">
            </span>

            0.2 – 0.3
        </div>


        <div>
            <span
                style="background:#1b7837;">
            </span>

            0.3 – 0.4
        </div>


        <div>
            <span
                style="background:#00441b;">
            </span>

            0.4 – 0.5
        </div>


        <hr>


        <div>

            <span
                style="
                    background:#00FF00;
                    opacity:0.6;
                "
            ></span>

            Mangrove Mask

        </div>


        <div>

            <span
                style="
                    background:#FF4444;
                    opacity:0.1;
                    border:2px solid #FF4444;
                "
            ></span>

            AOI Boundary

        </div>

    </div>


    <!-- ================================================= -->
    <!-- LEAFLET -->
    <!-- ================================================= -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


<!-- ========================================== -->
<!-- BUTTON PANEL - Upper Left -->
<!-- ========================================== -->

<div id="buttonPanel">
    <button id="btnStudyArea" class="map-button">📷 Study Area</button>
    <button id="btnNDVI" class="map-button">📈 NDVI Trajectories</button>
    <button id="btnMask" class="map-button">🗺️ Mask Trajectories</button>
</div>

<!-- ========================================== -->
<!-- MODAL OVERLAYS (Hidden by default) -->
<!-- ========================================== -->

<!-- Study Area Modal -->
<div id="modalStudyArea" class="modal">
    <div class="modal-content">
        <span class="close-btn" id="closeStudyArea">&times;</span>
        <img src="data/images/study_area.jpg" alt="Study Area" class="modal-image">
    </div>
</div>

<!-- NDVI Trajectories Modal -->
<div id="modalNDVI" class="modal">
    <div class="modal-content">
        <span class="close-btn" id="closeNDVI">&times;</span>
        <img src="data/images/ndvi_trajectories.png" alt="NDVI Trajectories" class="modal-image">
    </div>
</div>

<!-- Mask Trajectories Modal -->
<div id="modalMask" class="modal">
    <div class="modal-content">
        <span class="close-btn" id="closeMask">&times;</span>
        <img src="data/images/mask_trajectories.png" alt="Mask Trajectories" class="modal-image">
    </div>
</div>


    
    <!-- ================================================= -->
    <!-- GEORASTER -->
    <!-- ================================================= -->

    <script
        src="https://unpkg.com/georaster">
    </script>


    <!-- ================================================= -->
    <!-- GEORASTER LAYER -->
    <!-- ================================================= -->

    <script
        src="https://unpkg.com/georaster-layer-for-leaflet/georaster-layer-for-leaflet.browserify.min.js">
    </script>


    <!-- ================================================= -->
    <!-- GROUPED LAYER CONTROL -->
    <!-- ================================================= -->

    <script
        src="https://unpkg.com/leaflet-groupedlayercontrol@0.6.1/dist/leaflet.groupedlayercontrol.min.js">
    </script>


    <!-- ================================================= -->
    <!-- APPLICATION -->
    <!-- ================================================= -->

    <script src="js/config.js"></script>

    <script src="js/map.js"></script>

    <script src="js/layers.js"></script>

</body>

</html>
