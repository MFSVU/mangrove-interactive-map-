<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mangrove Monitoring - Egypt's Red Sea Coast</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Leaflet COG Plugin CSS (if needed) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-cog@0.3.3/dist/leaflet-cog.min.css">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="map"></div>
    
    <!-- Legend -->
    <div id="legend">
        <h4>🌿 Mangrove Health (NDVI)</h4>
        <div><span style="background:#d73027;"></span> -0.5 – 0.0</div>
        <div><span style="background:#f46d43;"></span> 0.0 – 0.2</div>
        <div><span style="background:#fdae61;"></span> 0.2 – 0.4</div>
        <div><span style="background:#fee08b;"></span> 0.4 – 0.6</div>
        <div><span style="background:#d9ef8b;"></span> 0.6 – 0.8</div>
        <div><span style="background:#a6d96a;"></span> 0.8 – 1.0</div>
        <hr style="margin: 8px 0;">
        <div><span style="background:#00FF00; opacity:0.6;"></span> Mangrove Mask</div>
        <div><span style="background:#FF4444; opacity:0.1; border:2px solid #FF4444;"></span> AOI Boundary</div>
    </div>

    <!-- ============================================ -->
    <!-- LEAFET AND PLUGINS - MUST LOAD IN ORDER -->
    <!-- ============================================ -->
    
    <!-- 1. Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- 2. Leaflet COG Plugin -->
    <script src="https://cdn.jsdelivr.net/npm/leaflet-cog@0.3.3/dist/leaflet-cog.min.js"></script>
    
    <!-- ============================================ -->
    <!-- YOUR APPLICATION SCRIPTS -->
    <!-- ============================================ -->
    
    <script src="js/config.js"></script>
    <script src="js/layers.js"></script>
    <script src="js/map.js"></script>
</body>
</html>
